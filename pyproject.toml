[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dwd-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for DWD (Deutscher Wetterdienst) — ICON forecasts, current weather, official warnings & pollen via Open-Meteo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
dwd-mcp = "dwd_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dwd_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real https://www.dwd.de site"]
